name: Contribution scope

# Pull requests from forks (including those the Distiller app opens) may only add or change
# recipes and reports. The Validate workflow checks their content.
on:
  pull_request:

permissions:
  contents: read

jobs:
  scope:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check changed files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/check_pr.py --base "origin/$BASE_REF"
