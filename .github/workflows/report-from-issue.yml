# When a maintainer labels a report issue with `report`, convert it into a pull request.
# The issue body is untrusted. It is read from the event file by the script, validated
# against the schema, and never interpolated into a shell command.
name: Report from issue

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  convert:
    if: github.event.label.name == 'report'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - id: convert
        run: python scripts/issue_to_report.py --event "$GITHUB_EVENT_PATH"
      - name: Validate the whole repository with the new report
        run: python scripts/build_index.py --check
      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          REPORT: ${{ steps.convert.outputs.path }}
        run: |
          branch="report/issue-${ISSUE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "$REPORT"
          git commit -m "Add compatibility report from #${ISSUE}"
          git push origin "$branch"
          gh pr create --head "$branch" --title "Compatibility report from #${ISSUE}" --body "Closes #${ISSUE}"
